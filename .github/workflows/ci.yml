name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run ci:quality

  local-runtime-linux:
    name: Local Runtime (Rust, Linux PTY)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Rust tests (unit + integration)
        working-directory: runtime
        run: cargo test --all-targets

      - name: Run gated PTY execution tests (POSIX)
        working-directory: runtime
        run: cargo test --all-targets -- --ignored

  local-runtime-windows-msvc:
    name: Local Runtime (Rust, Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release MSVC artifact (ADR-001 target evidence)
        working-directory: runtime
        run: cargo build --release

      - name: Generate SHA-256 and provenance
        working-directory: runtime
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/deepseek-pp-local-runtime.exe"
          if (-not (Test-Path $bin)) { $bin = "target/release/deepseek-pp-local-runtime.exe" }
          if (-not (Test-Path $bin)) { throw "release binary not found at $bin" }
          $hash = (Get-FileHash $bin -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $bin -Leaf)" | Out-File -Encoding ascii "$bin.sha256"
          $cargoLockHash = (Get-FileHash "Cargo.lock" -Algorithm SHA256).Hash.ToLower()
          $commit = "${{ github.sha }}"
          if (-not $commit) { $commit = (git rev-parse HEAD).Trim() }
          $rustcVer = (rustc --version)
          $cargoVer = (cargo --version)
          $provenance = @{
            head_sha = $commit
            target = "x86_64-pc-windows-msvc"
            rustc = $rustcVer
            cargo = $cargoVer
            cargo_lock_sha256 = $cargoLockHash
            binary = (Split-Path $bin -Leaf)
            binary_sha256 = $hash
            built_at = (Get-Date -Format o)
          } | ConvertTo-Json -Depth 4
          $provenance | Out-File -Encoding utf8 "provenance.json"
          Write-Host "SHA256: $hash"
          Write-Host "Provenance:"
          Write-Host $provenance
          Get-Content "$bin.sha256"
          Get-Content "provenance.json"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-pp-local-runtime-windows-x64-${{ github.sha }}
          path: |
            runtime/target/x86_64-pc-windows-msvc/release/deepseek-pp-local-runtime.exe
            runtime/target/release/deepseek-pp-local-runtime.exe
            runtime/target/x86_64-pc-windows-msvc/release/deepseek-pp-local-runtime.exe.sha256
            runtime/target/release/deepseek-pp-local-runtime.exe.sha256
            runtime/provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Run Rust tests (unit + integration)
        working-directory: runtime
        run: cargo test --all-targets

      - name: Run gated PTY + Job Object teardown tests (native MSVC ConPTY)
        working-directory: runtime
        run: cargo test --all-targets -- --ignored

